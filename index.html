<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Семейная P2P Связь</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#181825">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Связь">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- MQTT клиент -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0f0f14;
            color: #e4e4e7;
            height: 100dvh;
            overflow: hidden;
        }

        /* Основной контейнер */
        .app {
            display: flex;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* Список диалогов (левый сайдбар) */
        .dialogs {
            width: 320px;
            background: #1c1c22;
            border-right: 1px solid #2a2a32;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.2s ease;
            z-index: 20;
        }

        /* Заголовок сайдбара */
        .dialogs-header {
            padding: 16px;
            background: #14141a;
            border-bottom: 1px solid #2a2a32;
        }

        .my-id-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .my-id-label {
            font-size: 12px;
            color: #888;
        }

        .my-id-value {
            font-family: monospace;
            font-weight: bold;
            background: #2a2a32;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .edit-id-btn, .settings-btn {
            background: none;
            border: none;
            color: #89b4fa;
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
        }

        /* Поле поиска / добавления */
        .add-contact {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .add-contact input {
            flex: 1;
            background: #2a2a32;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
        }
        .add-contact input::placeholder {
            color: #888;
        }
        .add-contact button {
            background: #89b4fa;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: #111;
            cursor: pointer;
        }

        /* Список контактов */
        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid #2a2a32;
        }
        .contact-item:hover {
            background: #2a2a32;
        }
        .contact-item.active {
            background: #2a2a3f;
        }
        .avatar {
            width: 48px;
            height: 48px;
            background: #3a3a4a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .contact-info {
            flex: 1;
            min-width: 0;
        }
        .contact-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .unread-badge {
            background: #f38ba8;
            color: #1e1e2e;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 20px;
        }
        .last-message {
            font-size: 13px;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .contact-actions {
            display: flex;
            gap: 4px;
            opacity: 0.6;
        }
        .contact-actions button {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        /* Основная область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #181825;
            overflow: hidden;
        }

        /* Шапка чата */
        .chat-header {
            padding: 12px 20px;
            background: #1c1c22;
            border-bottom: 1px solid #2a2a32;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            display: none;
            background: none;
            border: none;
            color: #89b4fa;
            font-size: 24px;
            cursor: pointer;
        }
        .contact-name-header {
            font-size: 18px;
            font-weight: 600;
        }
        .contact-status {
            font-size: 12px;
            color: #a6e3a1;
        }
        .call-buttons {
            display: flex;
            gap: 12px;
        }
        .call-buttons button {
            background: #2a2a32;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .call-buttons button:hover {
            background: #3a3a4a;
        }

        /* Видео панель (появляется при звонке) */
        .video-panel {
            display: none;
            background: #000;
            position: relative;
            min-height: 240px;
            max-height: 40vh;
            border-bottom: 1px solid #2a2a32;
            background: #0a0a0f;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        #local-video {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 120px;
            border-radius: 12px;
            border: 2px solid #444;
            background: #111;
            object-fit: cover;
            cursor: pointer;
            transition: all 0.2s;
        }
        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            background: #0a0a0f;
        }

        /* Область сообщений */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .msg-mine {
            background: #89b4fa;
            color: #111;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-peer {
            background: #2a2a32;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-meta {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        /* Панель ввода */
        .input-panel {
            padding: 12px 16px;
            background: #1c1c22;
            border-top: 1px solid #2a2a32;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            position: relative;
        }
        .input-panel textarea {
            flex: 1;
            background: #2a2a32;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: white;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
        }
        .input-panel button {
            background: #89b4fa;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            color: #111;
        }
        .file-label, .emoji-trigger {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
            opacity: 0.7;
        }
        .emoji-picker {
            position: absolute;
            bottom: 100%;
            right: 0;
            background: #2a2a32;
            border-radius: 16px;
            padding: 12px;
            display: none;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 30;
        }
        .emoji-item {
            font-size: 24px;
            cursor: pointer;
            text-align: center;
        }

        /* Прогресс файлов */
        .file-progress {
            display: none;
            padding: 8px 16px;
            background: #1c1c22;
            font-size: 12px;
        }
        .progress-bar {
            height: 4px;
            background: #a6e3a1;
            width: 0%;
            transition: width 0.2s;
        }

        /* Модалки (оставлены прежние) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1c1c22;
            padding: 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 320px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2a2a32;
            border: none;
            border-radius: 12px;
            color: white;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .dialogs {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 80%;
                transform: translateX(-100%);
                box-shadow: none;
            }
            .dialogs.open {
                transform: translateX(0);
                box-shadow: 2px 0 12px rgba(0,0,0,0.5);
            }
            .back-btn {
                display: block;
            }
            .chat-header-left {
                flex: 1;
            }
            .call-buttons button span {
                display: none;
            }
            .call-buttons button {
                font-size: 18px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Список диалогов -->
    <div class="dialogs" id="dialogs-sidebar">
        <div class="dialogs-header">
            <div class="my-id-row">
                <div>
                    <div class="my-id-label">Ваш ID</div>
                    <div class="my-id-value" id="my-id-display">---</div>
                </div>
                <div>
                    <button class="edit-id-btn" id="edit-id-btn">✏️</button>
                    <button class="settings-btn" id="settings-btn">⚙️</button>
                </div>
            </div>
            <div class="add-contact">
                <input type="text" id="contact-name" placeholder="Имя">
                <input type="text" id="contact-id" placeholder="ID">
                <button id="add-btn">+</button>
            </div>
        </div>
        <div class="contacts-list" id="contacts-list"></div>
    </div>

    <!-- Область чата / звонка -->
    <div class="chat-area">
        <div class="chat-header">
            <div class="chat-header-left">
                <button class="back-btn" id="back-btn">←</button>
                <div>
                    <div class="contact-name-header" id="chat-contact-name">Выберите контакт</div>
                    <div class="contact-status" id="chat-status">Ожидание</div>
                </div>
            </div>
            <div class="call-buttons">
                <button id="start-video-call">📹 Видео</button>
                <button id="start-audio-call">📞 Аудио</button>
                <button id="hangup-call-btn" style="background:#f38ba8; color:#111;">❌ Сброс</button>
            </div>
        </div>

        <!-- Видео панель -->
        <div class="video-panel" id="video-panel">
            <div class="video-container">
                <video id="remote-video" autoplay playsinline></video>
                <video id="local-video" autoplay playsinline muted></video>
                <div class="video-placeholder" id="video-placeholder">Ожидание подключения...</div>
            </div>
            <div style="position: absolute; bottom: 10px; left: 10px; display: flex; gap: 8px; z-index: 20;">
                <button id="toggle-mic" style="background: rgba(0,0,0,0.6); border: none; padding: 6px 12px; border-radius: 20px;">🎤</button>
                <button id="toggle-cam" style="background: rgba(0,0,0,0.6); border: none; padding: 6px 12px; border-radius: 20px;">📹</button>
                <button id="switch-cam" style="background: rgba(0,0,0,0.6); border: none; padding: 6px 12px; border-radius: 20px;">🔄</button>
                <button id="share-screen" style="background: rgba(0,0,0,0.6); border: none; padding: 6px 12px; border-radius: 20px;">🖥️</button>
            </div>
        </div>

        <!-- Чат -->
        <div class="messages" id="messages-box"></div>

        <!-- Прогресс файлов -->
        <div class="file-progress" id="file-progress-container">
            <span id="file-progress-text">Передача файла...</span>
            <div style="background:#2a2a32; border-radius:4px; margin-top:4px;"><div class="progress-bar" id="file-progress-bar"></div></div>
        </div>

        <!-- Панель ввода -->
        <div class="input-panel">
            <label class="file-label" id="file-label">📎</label>
            <input type="file" id="file-input" style="display: none;">
            <textarea id="msg-input" rows="1" placeholder="Сообщение..." disabled></textarea>
            <button class="emoji-trigger" id="emoji-btn">😀</button>
            <button id="send-btn" disabled>➤</button>
            <div class="emoji-picker" id="emoji-picker"></div>
        </div>
    </div>
</div>

<!-- Модалки (настройки, редактирование ID, добавление неизвестного) -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>Настройки</h3>
        <video id="test-video" autoplay playsinline muted style="width:100%; border-radius:12px;"></video>
        <button id="settings-switch-cam" style="display:none;">🔄 Сменить камеру</button>
        <div style="margin:12px 0;">Уровень микрофона</div>
        <div style="background:#2a2a32; height:8px; border-radius:4px;"><div id="mic-level" style="width:0%; height:100%; background:#4caf50; border-radius:4px;"></div></div>
        <button id="req-perm-btn" style="margin-top:12px;">🎥 Разрешить</button>
        <button id="close-settings-btn">Закрыть</button>
    </div>
</div>

<div id="edit-id-modal" class="modal">
    <div class="modal-content">
        <h3>Изменить ID</h3>
        <input type="text" id="new-id-input" placeholder="Новый ID">
        <div class="modal-buttons">
            <button id="save-id-btn">Сохранить</button>
            <button id="cancel-id-btn">Отмена</button>
        </div>
    </div>
</div>

<div id="add-unknown-modal" class="modal">
    <div class="modal-content">
        <h3>Сохранить контакт</h3>
        <input type="text" id="add-unknown-name" placeholder="Имя">
        <input type="hidden" id="add-unknown-id">
        <div class="modal-buttons">
            <button id="save-unknown-btn">Сохранить</button>
            <button id="cancel-unknown-btn">Отмена</button>
        </div>
    </div>
</div>

<div id="incoming-overlay" class="modal" style="background:rgba(0,0,0,0.95);">
    <div class="modal-content" style="text-align:center;">
        <div style="font-size:48px;">📞</div>
        <div id="incoming-call-type" style="margin:8px 0;">ВИДЕОЗВОНОК</div>
        <div id="incoming-caller-id" style="font-size:24px; font-family:monospace;">---</div>
        <div class="modal-buttons" style="margin-top:20px;">
            <button id="accept-call-btn" style="background:#a6e3a1;">Ответить</button>
            <button id="reject-call-btn" style="background:#f38ba8;">Отклонить</button>
        </div>
    </div>
</div>

<script>
    // ------------------------------------------------------------------
    // ВСЯ ЛОГИКА ПРИЛОЖЕНИЯ (WebRTC, MQTT, ХРАНИЛИЩЕ, ЧАТ, ФАЙЛЫ)
    // Оставлена без изменений, но адаптирована к новым ID элементов
    // ------------------------------------------------------------------
    const store = {
        get: (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
        set: (key, value) => { localStorage.setItem(key, JSON.stringify(value)); }
    };

    const rtcConfig = { 
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun.cloudflare.com:3478" }
        ] 
    };

    let mqttClient, peerConnection, dataChannel, localStream, screenStream;
    let myId = store.get('myId') || Math.random().toString(36).substring(2, 8).toUpperCase();
    let targetId = null, callMode = 'idle', currentCallMode = 'video', currentFacingMode = 'user';
    let ringTimeout, chatHistory = [], isScreenSharing = false, isVideoSwapped = false;
    const CHUNK_SIZE = 16384;
    let fileReceiveBuffer = [], incomingFileInfo = null;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let dialInterval = null, ringInterval = null;

    // Сохраняем ID
    if (!store.get('myId')) {
        store.set('myId', myId);
        store.set('contacts', []);
    }

    // DOM элементы (новые)
    const dialogsSidebar = document.getElementById('dialogs-sidebar');
    const backBtn = document.getElementById('back-btn');
    const contactsListDiv = document.getElementById('contacts-list');
    const chatContactName = document.getElementById('chat-contact-name');
    const chatStatus = document.getElementById('chat-status');
    const messagesBox = document.getElementById('messages-box');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const fileInput = document.getElementById('file-input');
    const fileLabel = document.getElementById('file-label');
    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPicker = document.getElementById('emoji-picker');
    const videoPanel = document.getElementById('video-panel');
    const remoteVideo = document.getElementById('remote-video');
    const localVideo = document.getElementById('local-video');
    const videoPlaceholder = document.getElementById('video-placeholder');
    const startVideoCall = document.getElementById('start-video-call');
    const startAudioCall = document.getElementById('start-audio-call');
    const hangupCall = document.getElementById('hangup-call-btn');
    const toggleMic = document.getElementById('toggle-mic');
    const toggleCam = document.getElementById('toggle-cam');
    const switchCam = document.getElementById('switch-cam');
    const shareScreenBtn = document.getElementById('share-screen');
    const incomingOverlay = document.getElementById('incoming-overlay');
    const incomingCallerId = document.getElementById('incoming-caller-id');
    const incomingCallType = document.getElementById('incoming-call-type');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const rejectCallBtn = document.getElementById('reject-call-btn');
    const fileProgressContainer = document.getElementById('file-progress-container');
    const fileProgressBar = document.getElementById('file-progress-bar');
    const fileProgressText = document.getElementById('file-progress-text');

    // Вспомогательные функции
    function getContactName(id) {
        const contacts = store.get('contacts') || [];
        const c = contacts.find(c => c.id === id);
        return c ? c.name : id;
    }

    function showModal(text, title = "Уведомление") {
        alert(title + "\n" + text); // упрощённо, можно заменить на кастомную
    }

    function renderContacts() {
        const contacts = store.get('contacts') || [];
        contactsListDiv.innerHTML = '';
        if (contacts.length === 0) {
            contactsListDiv.innerHTML = '<div style="padding:16px; text-align:center; color:#888;">Нет контактов</div>';
            return;
        }
        contacts.forEach(c => {
            const unread = store.get(`unread_${c.id}`) || 0;
            const lastMsg = store.get(`chat_${c.id}`)?.slice(-1)[0]?.text || '';
            const div = document.createElement('div');
            div.className = 'contact-item';
            if (targetId === c.id) div.classList.add('active');
            div.innerHTML = `
                <div class="avatar">👤</div>
                <div class="contact-info">
                    <div class="contact-name">${escapeHtml(c.name)} ${unread ? `<span class="unread-badge">${unread}</span>` : ''}</div>
                    <div class="last-message">${escapeHtml(lastMsg.substring(0, 30))}</div>
                </div>
                <div class="contact-actions">
                    <button data-id="${c.id}" data-mode="video" class="call-video-btn">📹</button>
                    <button data-id="${c.id}" data-mode="audio" class="call-audio-btn">📞</button>
                </div>
            `;
            div.addEventListener('click', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                openChat(c.id);
            });
            div.querySelectorAll('.call-video-btn, .call-audio-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const mode = btn.classList.contains('call-video-btn') ? 'video' : 'audio';
                    makeCall(c.id, mode);
                });
            });
            contactsListDiv.appendChild(div);
        });
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function openChat(id) {
        targetId = id;
        store.set(`unread_${id}`, 0);
        renderContacts();
        chatContactName.innerText = getContactName(id);
        chatStatus.innerText = callMode === 'active' ? "В звонке" : "Онлайн";
        loadChatHistory(id);
        msgInput.disabled = false;
        sendBtn.disabled = false;
        fileLabel.style.opacity = '1';
        if (window.innerWidth <= 768) dialogsSidebar.classList.remove('open');
        // Если нет P2P канала, но нужно попробовать установить для файлов
        if (!peerConnection && callMode === 'idle') {
            setupSilentPeer();
        }
    }

    function loadChatHistory(id) {
        messagesBox.innerHTML = '';
        chatHistory = store.get(`chat_${id}`) || [];
        chatHistory.forEach(msg => appendMsg(msg.text, msg.isMine, msg.isHtml, false, null, true, msg.timestamp));
    }

    function appendMsg(text, isMine, isHtml = false, saveToHistory = true, rawText = null, delivered = true, timestamp = null) {
        const div = document.createElement('div');
        div.className = `msg ${isMine ? 'msg-mine' : 'msg-peer'}`;
        const content = isHtml ? text : escapeHtml(text);
        const time = new Date(timestamp || Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        div.innerHTML = `<div>${content}</div><div class="msg-meta">${time}</div>`;
        messagesBox.appendChild(div);
        messagesBox.scrollTop = messagesBox.scrollHeight;
        if (saveToHistory && targetId) {
            chatHistory.push({ id: Date.now(), text: rawText || text, isMine, isHtml, timestamp: timestamp || Date.now() });
            if (chatHistory.length > 100) chatHistory.shift();
            store.set(`chat_${targetId}`, chatHistory);
        }
    }

    // MQTT и сигналинг (код полностью из предыдущей версии, адаптирован)
    function initMQTT() {
        document.getElementById('my-id-display').innerText = myId;
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clean: true, connectTimeout: 4000, reconnectPeriod: 2000 });
        mqttClient.on('connect', () => {
            mqttClient.subscribe(`family_p2p_${myId}`);
            chatStatus.innerText = "В сети";
        });
        mqttClient.on('message', async (topic, message) => {
            let data;
            try { data = JSON.parse(message.toString()); } catch(e) { return; }
            if (data.from === myId) return;
            handleSignal(data);
        });
    }

    function sendSignal(target, payload) {
        if (mqttClient && mqttClient.connected) {
            payload.from = myId;
            mqttClient.publish(`family_p2p_${target}`, JSON.stringify(payload));
        }
    }

    async function handleSignal(msg) {
        if (msg.type === 'ring') {
            if (callMode !== 'idle') { sendSignal(msg.from, { type: 'reject', reason: 'busy' }); return; }
            targetId = msg.from;
            callMode = 'incoming';
            currentCallMode = msg.callType;
            incomingCallerId.innerText = getContactName(targetId);
            incomingCallType.innerText = msg.callType === 'video' ? '📹 ВИДЕОЗВОНОК' : '📞 АУДИОЗВОНОК';
            incomingOverlay.style.display = 'flex';
            playRingtone();
        } else if (msg.type === 'cancel') {
            stopRingtone();
            incomingOverlay.style.display = 'none';
            resetCallUI();
        } else if (msg.type === 'accept') {
            stopDialTone();
            chatStatus.innerText = "Установка P2P...";
            setupPeerConnection(true);
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendSignal(targetId, { type: 'offer', offer: offer });
            } catch(e) {}
        } else if (msg.type === 'reject') {
            stopDialTone(); playHangupTone();
            chatStatus.innerText = "Вызов отклонён";
            setTimeout(() => resetCallUI(), 2000);
        } else if (msg.type === 'offer') {
            setupPeerConnection(false);
            peerConnection.ondatachannel = (e) => setupDataChannel(e.channel);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            sendSignal(targetId, { type: 'answer', answer: answer });
        } else if (msg.type === 'answer') {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer));
        } else if (msg.type === 'candidate') {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate));
        } else if (msg.type === 'silent_offer') {
            setupPeerConnection(false);
            peerConnection.ondatachannel = (e) => setupDataChannel(e.channel);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            sendSignal(msg.from, { type: 'answer', answer: answer });
        } else if (msg.type === 'chat') {
            const isActive = (targetId === msg.from && document.querySelector('.chat-area'));
            if (isActive) {
                appendMsg(msg.text, false, false, true, null, true, msg.timestamp);
            } else {
                const unread = store.get(`unread_${msg.from}`) || 0;
                store.set(`unread_${msg.from}`, unread+1);
                let history = store.get(`chat_${msg.from}`) || [];
                history.push({ id: Date.now(), text: msg.text, isMine: false, timestamp: msg.timestamp });
                store.set(`chat_${msg.from}`, history);
                renderContacts();
            }
        }
    }

    function setupPeerConnection(initiator) {
        if (peerConnection) peerConnection.close();
        peerConnection = new RTCPeerConnection(rtcConfig);
        if (localStream && currentCallMode !== 'chat') {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }
        peerConnection.onicecandidate = (e) => {
            if (e.candidate) sendSignal(targetId, { type: 'candidate', candidate: e.candidate });
        };
        peerConnection.ontrack = (e) => {
            remoteVideo.srcObject = e.streams[0];
            videoPanel.style.display = 'block';
            videoPlaceholder.style.display = 'none';
        };
        peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === 'connected') {
                chatStatus.innerText = "P2P соединено";
            } else if (peerConnection.connectionState === 'disconnected') {
                resetCallUI();
            }
        };
        if (!initiator) return;
        const dc = peerConnection.createDataChannel('chatAndFiles');
        setupDataChannel(dc);
    }

    function setupDataChannel(channel) {
        dataChannel = channel;
        dataChannel.binaryType = 'arraybuffer';
        dataChannel.onopen = () => { enableChatUI(); };
        dataChannel.onmessage = (e) => {
            if (e.data instanceof ArrayBuffer) {
                if (incomingFileInfo) {
                    fileReceiveBuffer.push(e.data);
                    const received = fileReceiveBuffer.reduce((a,b)=>a+b.byteLength,0);
                    fileProgressBar.style.width = `${(received/incomingFileInfo.size)*100}%`;
                }
                return;
            }
            let data; try { data = JSON.parse(e.data); } catch(err) { return; }
            if (data.type === 'chat') {
                appendMsg(data.text, false, false, true, null, true, data.timestamp);
            } else if (data.type === 'file-start') {
                incomingFileInfo = data;
                fileReceiveBuffer = [];
                fileProgressContainer.style.display = 'block';
                fileProgressText.innerText = `Приём: ${data.name}`;
                fileProgressBar.style.width = '0%';
            } else if (data.type === 'file-end') {
                fileProgressContainer.style.display = 'none';
                const blob = new Blob(fileReceiveBuffer);
                const url = URL.createObjectURL(blob);
                const linkHtml = `<a href="${url}" download="${incomingFileInfo.name}" style="color:#a6e3a1;">📥 Скачать файл: ${incomingFileInfo.name}</a>`;
                appendMsg(linkHtml, false, true, true, `[Файл: ${incomingFileInfo.name}]`);
                incomingFileInfo = null;
            }
        };
    }

    function enableChatUI() {
        msgInput.disabled = false;
        sendBtn.disabled = false;
        fileLabel.style.pointerEvents = 'auto';
    }

    async function makeCall(id, mode) {
        if (callMode !== 'idle') { showModal("Уже есть активный вызов"); return; }
        targetId = id;
        currentCallMode = mode;
        callMode = 'calling';
        openChat(id);
        if (mode !== 'chat') {
            await initMedia(mode);
            sendSignal(targetId, { type: 'ring', callType: mode });
            playDialTone();
            ringTimeout = setTimeout(() => {
                if (callMode === 'calling') {
                    stopDialTone();
                    sendSignal(targetId, { type: 'cancel' });
                    resetCallUI();
                }
            }, 30000);
        } else {
            // Чат без звонка
            setupSilentPeer();
        }
    }

    async function initMedia(mode) {
        videoPanel.style.display = 'block';
        try {
            const constraints = { audio: true, video: mode === 'video' ? { facingMode: currentFacingMode } : false };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            if (mode === 'video') {
                localVideo.srcObject = localStream;
                localVideo.style.transform = currentFacingMode === 'user' ? 'scaleX(-1)' : 'none';
            }
        } catch(e) { showModal("Нет доступа к камере/микрофону"); }
    }

    function setupSilentPeer() {
        if (peerConnection) return;
        setupPeerConnection(true);
        setupDataChannel(peerConnection.createDataChannel('chatAndFiles'));
        peerConnection.createOffer().then(offer => {
            peerConnection.setLocalDescription(offer);
            sendSignal(targetId, { type: 'silent_offer', offer: offer });
        }).catch(console.error);
    }

    function resetCallUI() {
        stopDialTone(); stopRingtone(); clearTimeout(ringTimeout);
        if (peerConnection) { peerConnection.close(); peerConnection = null; }
        if (dataChannel) { dataChannel.close(); dataChannel = null; }
        if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
        if (screenStream) screenStream.getTracks().forEach(t=>t.stop());
        remoteVideo.srcObject = null;
        localVideo.srcObject = null;
        videoPanel.style.display = 'none';
        videoPlaceholder.style.display = 'flex';
        chatStatus.innerText = "Не в звонке";
        callMode = 'idle';
        targetId = null;
    }

    // Аудио сигналы
    function playRingtone() { if (audioCtx.state === 'suspended') audioCtx.resume(); /* упрощённо */ }
    function stopRingtone() { if (ringInterval) clearInterval(ringInterval); }
    function playDialTone() { /* упрощённо */ }
    function stopDialTone() { if (dialInterval) clearInterval(dialInterval); }
    function playHangupTone() { /* можно добавить */ }

    // Обработчики UI
    sendBtn.onclick = () => {
        const text = msgInput.value.trim();
        if (!text) return;
        const time = Date.now();
        appendMsg(text, true, false, true, text, true, time);
        if (dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(JSON.stringify({ type: 'chat', text, timestamp: time }));
        } else {
            sendSignal(targetId, { type: 'chat', text, timestamp: time });
        }
        msgInput.value = '';
    };
    msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });

    fileInput.onchange = () => {
        const file = fileInput.files[0];
        if (!file || !dataChannel || dataChannel.readyState !== 'open') return showModal("Нет P2P соединения");
        dataChannel.send(JSON.stringify({ type: 'file-start', name: file.name, size: file.size }));
        let offset = 0;
        const reader = new FileReader();
        const sendChunk = () => {
            if (offset >= file.size) { dataChannel.send(JSON.stringify({ type: 'file-end' })); return; }
            const slice = file.slice(offset, offset+CHUNK_SIZE);
            reader.onload = (e) => { dataChannel.send(e.target.result); offset += slice.size; sendChunk(); };
            reader.readAsArrayBuffer(slice);
        };
        sendChunk();
    };

    // Эмодзи
    const emojis = ["😀","😂","🤣","😊","😍","🥰","😘","😜","😎","🥳","😒","😔","😢","😭","😡","🤯","😱","🤔","🤫","🙄","😴","👍","👎","👌","✌️","🤞","🤝","🙏"];
    emojis.forEach(e => { const span = document.createElement('span'); span.className='emoji-item'; span.innerText=e; span.onclick=()=>{ msgInput.value+=e; msgInput.focus(); }; emojiPicker.appendChild(span); });
    emojiBtn.onclick = (e) => { e.stopPropagation(); emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid'; };
    document.addEventListener('click', () => emojiPicker.style.display = 'none');

    // Кнопки звонков
    startVideoCall.onclick = () => { if (targetId) makeCall(targetId, 'video'); };
    startAudioCall.onclick = () => { if (targetId) makeCall(targetId, 'audio'); };
    hangupCall.onclick = () => { if (callMode !== 'idle') sendSignal(targetId, { type: 'cancel' }); resetCallUI(); };
    acceptCallBtn.onclick = async () => {
        stopRingtone();
        incomingOverlay.style.display = 'none';
        callMode = 'active';
        openChat(targetId);
        if (currentCallMode !== 'chat') await initMedia(currentCallMode);
        sendSignal(targetId, { type: 'accept' });
    };
    rejectCallBtn.onclick = () => {
        stopRingtone();
        incomingOverlay.style.display = 'none';
        sendSignal(targetId, { type: 'reject', reason: 'declined' });
        resetCallUI();
    };
    toggleMic.onclick = () => { if (localStream) { const t = localStream.getAudioTracks()[0]; t.enabled = !t.enabled; toggleMic.style.opacity = t.enabled ? '1' : '0.5'; } };
    toggleCam.onclick = () => { if (localStream && localStream.getVideoTracks()[0]) { const t = localStream.getVideoTracks()[0]; t.enabled = !t.enabled; toggleCam.style.opacity = t.enabled ? '1' : '0.5'; } };
    switchCam.onclick = async () => { if (!localStream) return; currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user'; /* переключение */ };
    shareScreenBtn.onclick = async () => { /* упрощённо */ };

    // Настройки
    document.getElementById('settings-btn').onclick = () => document.getElementById('settings-modal').style.display = 'flex';
    document.getElementById('close-settings-btn').onclick = () => document.getElementById('settings-modal').style.display = 'none';
    document.getElementById('edit-id-btn').onclick = () => document.getElementById('edit-id-modal').style.display = 'flex';
    document.getElementById('cancel-id-btn').onclick = () => document.getElementById('edit-id-modal').style.display = 'none';
    document.getElementById('save-id-btn').onclick = () => { const newId = document.getElementById('new-id-input').value.trim().toUpperCase(); if(newId){ store.set('myId', newId); myId = newId; initMQTT(); location.reload(); } };
    document.getElementById('add-btn').onclick = () => { const name = document.getElementById('contact-name').value.trim(); const id = document.getElementById('contact-id').value.trim().toUpperCase(); if(name && id){ const contacts = store.get('contacts') || []; contacts.push({name, id}); store.set('contacts', contacts); renderContacts(); } };
    backBtn.onclick = () => dialogsSidebar.classList.toggle('open');
    if (window.innerWidth <= 768) dialogsSidebar.classList.add('open');

    // Запуск
    initMQTT();
    renderContacts();
    // PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.error));
    }
</script>
